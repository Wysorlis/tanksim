[project]
name = "tanksim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LAVOINNE Guilhem", email = "lavoinne.guilhem@outlook.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib",
]

[project.scripts]
tanksim = "tanksim:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = ["--import-mode=importlib"]
